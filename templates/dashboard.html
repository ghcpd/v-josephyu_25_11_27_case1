{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">Welcome</div>
      <div class="card-body">
        <p>Hello, <strong>{{ user.username }}</strong>! You are logged in.</p>
        <a class="btn btn-outline-danger" href="{{ url_for('auth.logout') }}">Log Out</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
